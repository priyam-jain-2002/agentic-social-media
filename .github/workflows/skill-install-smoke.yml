name: Installable skill smoke test

on:
  push:
    branches: [main]
    paths:
      - 'skills/agentic-social-media/**'
      - '.github/workflows/skill-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install skill from public GitHub repo
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/skill-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          git init --quiet

          echo "Installing agentic-social-media skill from GitHub..."
          npx --yes skills add priyam-jain-2002/agentic-social-media --skill agentic-social-media -a claude-code -y --copy

          echo "Installed skill files:"
          find "$consumer" -maxdepth 8 -type f -name '*.md' -print | sort
          skill_path="$(find "$consumer" -type f -path '*/agentic-social-media/SKILL.md' -print -quit)"
          if [[ -z "$skill_path" ]]; then
            echo "::error title=Missing skill::The npx installer returned without a discoverable agentic-social-media/SKILL.md"
            exit 1
          fi

          skill_dir="$(dirname "$skill_path")"
          test -s "$skill_dir/references/gates.md"
          test -s "$skill_dir/references/examples.md"
          echo "Verified installed skill and required bundled references: $skill_dir"
