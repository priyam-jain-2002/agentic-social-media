name: Installable skill smoke test

on:
  push:
    branches: [main]
    paths:
      - 'skills/agentic-social-media/**'
      - '.github/workflows/skill-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install skill from published GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/skill-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npx --yes skills add priyam-jain-2002/agentic-social-media --skill agentic-social-media -a claude-code -y --copy
          test -s ".agents/skills/agentic-social-media/SKILL.md"
          test -s ".agents/skills/agentic-social-media/references/gates.md"
          test -s ".agents/skills/agentic-social-media/references/examples.md"
          echo "Verified installable skill and bundled references"
